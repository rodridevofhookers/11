<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feliz Nosso Dia 11</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Contador fixo */
        #contador-relacionamento {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 77, 109, 0.12);
            border: 2px solid #ff4d6d;
            color: #ff4d6d;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            z-index: 9999;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 15px rgba(255, 77, 109, 0.2);
            text-align: center;
        }

        .container {
            text-align: center;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 100px 20px 20px;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            color: #ff4d6d;
            margin-bottom: 40px;
        }

        .btn-abrir {
            font-family: 'Montserrat', sans-serif;
            font-weight: 700;
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: white;
            background-color: #ff4d6d;
            border: none;
            padding: 15px 45px;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.2s;
        }

        .btn-abrir:hover {
            background-color: #ff758f;
            transform: scale(1.05);
        }

        #telaSurpresa {
            display: none;
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
        }

        .grid-botoes {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
            align-items: center;
        }

        .btn-opcao {
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            width: 80%;
            max-width: 300px;
            padding: 12px;
            border: 2px solid #ff4d6d;
            background-color: #ffffff;
            color: #ff4d6d;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            transition: all 0.2s;
        }

        .btn-opcao:hover {
            background-color: #ff4d6d;
            color: #ffffff;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }

            #contador-relacionamento {
                width: 90%;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>

    <canvas id="canvasFogos"></canvas>

    <div id="contador-relacionamento">
        ❤️ Juntos há: <span id="tempoJuntos"></span>
    </div>

    <div class="container">
        <div id="telaInicial">
            <h1>Feliz nosso dia 11</h1>
            <button class="btn-abrir" onclick="abrirSurpresa()">Abrir</button>
        </div>

        <div id="telaSurpresa">
            <h1>SURPRESA!</h1>

            <div class="grid-botoes">
                <button class="btn-opcao">Botão 1</button>
                <button class="btn-opcao">Botão 2</button>
                <button class="btn-opcao">Botão 3</button>
            </div>
        </div>
    </div>

    <script>
        // CONTADOR
        function atualizarContador() {
            const inicio = new Date(2022, 7, 11, 0, 0, 0);
            const agora = new Date();

            const diff = agora - inicio;

            const segundos = Math.floor(diff / 1000) % 60;
            const minutos = Math.floor(diff / (1000 * 60)) % 60;
            const horas = Math.floor(diff / (1000 * 60 * 60)) % 24;

            const diasTotais = Math.floor(diff / (1000 * 60 * 60 * 24));

            const anos = Math.floor(diasTotais / 365.25);
            const dias = Math.floor(diasTotais - (anos * 365.25));

            document.getElementById("tempoJuntos").textContent =
                `${anos} anos, ${dias} dias, ${horas}h ${minutos}m ${segundos}s`;
        }

        atualizarContador();
        setInterval(atualizarContador, 1000);

        // TROCA DE TELA
        let animandoFogos = false;

        function abrirSurpresa() {
            document.getElementById('telaInicial').style.display = 'none';

            const telaSurpresa = document.getElementById('telaSurpresa');
            telaSurpresa.style.display = 'block';

            setTimeout(() => {
                telaSurpresa.style.opacity = '1';
            }, 50);

            animandoFogos = true;
            loopFogos();

            setInterval(() => {
                if (animandoFogos) criarFogo();
            }, 800);
        }

        // FOGOS DE ARTIFÍCIO
        const canvas = document.getElementById('canvasFogos');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        ajustarCanvas();
        window.addEventListener('resize', ajustarCanvas);

        let particulas = [];

        function criarFogo() {
            const x = Math.random() * canvas.width;
            const y = Math.random() * (canvas.height * 0.6);

            const cores = [
                '#ff4d6d',
                '#ff758f',
                '#ff8fab',
                '#ffb3c1',
                '#ffccd5'
            ];

            const cor = cores[Math.floor(Math.random() * cores.length)];

            for (let i = 0; i < 60; i++) {
                const angulo = Math.random() * Math.PI * 2;
                const velocidade = Math.random() * 4 + 2;

                particulas.push({
                    x,
                    y,
                    vx: Math.cos(angulo) * velocidade,
                    vy: Math.sin(angulo) * velocidade,
                    alfa: 1,
                    cor,
                    tamanho: Math.random() * 2 + 1
                });
            }
        }

        function loopFogos() {
            if (!animandoFogos) return;

            requestAnimationFrame(loopFogos);

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = particulas.length - 1; i >= 0; i--) {
                const p = particulas[i];

                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.04;
                p.alfa -= 0.015;

                if (p.alfa <= 0) {
                    particulas.splice(i, 1);
                    continue;
                }

                ctx.save();
                ctx.globalAlpha = p.alfa;
                ctx.fillStyle = p.cor;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.tamanho, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }
    </script>

</body>
</html>
